# ext-php-rs finds PHP through these before PATH, and speedyspec-php refuses to build if they point anywhere but the
# server's static build. `server` is the symlink made by `bun run runner:link`.
[env]
PHP = { value = "server/.php-build/buildroot/bin/php", relative = true }
PHP_CONFIG = { value = "server/.php-build/buildroot/bin/php-config", relative = true }
SPEEDYSPEC_PHP_PREFIX = { value = "server/.php-build/buildroot", relative = true }
MACOSX_DEPLOYMENT_TARGET = "12.0"
# libsodium-sys-stable (speedyspec-wp-crypto-sodium) links the static PHP's own libsodium.a, and speedyspec-php refuses
# any other SODIUM_LIB_DIR, so Rust and ext-sodium share one libsodium.
SODIUM_LIB_DIR = { value = "server/.php-build/buildroot/lib", relative = true }
# speedyspec-ffmpeg-sys (under speedyspec-wp-media-php) links the server's static FFmpeg build.
FFMPEG_PREFIX = { value = "server/.php-build/ffmpeg/prefix", relative = true }

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          composer install --no-interaction --no-progress --working-dir=packages/adapter-php-parser-source/extractor

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Read pins
        id: pins
        run: |
          echo "wordpress=$(jq -r .wordpress.sha256 sources.json)" >> "$GITHUB_OUTPUT"
          echo "server=$(jq -r .server.commit sources.json)" >> "$GITHUB_OUTPUT"

      - name: Cache WordPress and speedyspec-server
        uses: actions/cache@v4
        with:
          path: |
            .cache/wordpress-*
            .cache/speedyspec-server-*
          key: guide-sources-${{ steps.pins.outputs.wordpress }}-${{ steps.pins.outputs.server }}

      # The fork's packages/ commit must be pushed before CI can fetch it. Set the repository variable
      # GUIDE_FORK_PUSHED to "true" once it is.
      - name: Build
        if: vars.GUIDE_FORK_PUSHED == 'true'
        run: bun run guide all --offline

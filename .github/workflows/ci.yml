name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          composer install --no-interaction --no-progress --working-dir=packages/adapter-php-parser-source/extractor

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # The toolchain only; the site tests need Chromium and run in the site job.
        run: bun run test

  examples:
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: guide_examples
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GUIDE_SERVER_DIR: ${{ github.workspace }}/.cache/speedyspec-server
      GUIDE_MYSQL_URL: mysql://root:password@127.0.0.1:3306/guide_examples
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          echo "server=$(jq -r .server.commit sources.json)" >> "$GITHUB_OUTPUT"
          echo "wordpress=$(jq -r .wordpress.commit sources.json)" >> "$GITHUB_OUTPUT"

      - name: Check out speedyspec-server at the pin
        uses: actions/checkout@v4
        with:
          repository: SpeedySpec/speedyspec-server
          ref: ${{ steps.pins.outputs.server }}
          path: .cache/speedyspec-server

      - name: Cache the static PHP
        id: php
        uses: actions/cache@v4
        with:
          path: .cache/speedyspec-server/.php-build/buildroot
          key: php-${{ runner.os }}-${{ hashFiles('.cache/speedyspec-server/php-version', '.cache/speedyspec-server/craft.yml', '.cache/speedyspec-server/scripts/build-php.sh') }}

      - name: Build the static PHP
        if: steps.php.outputs.cache-hit != 'true'
        working-directory: .cache/speedyspec-server
        env:
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
        run: scripts/build-php.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      # ubuntu-latest ships clang 20, 21 and 22. bindgen (ext-php-rs) loads the newest libclang, 22, but takes its
      # builtin headers from the default clang, 21, whose SSE intrinsics call builtins that clang 22 removed. Point
      # bindgen at the libclang of the default clang so the two agree.
      - name: Use the libclang that matches clang
        run: echo "LIBCLANG_PATH=$(dirname "$(dirname "$(clang -print-resource-dir)")")" >> "$GITHUB_ENV"

      - name: Cache the runner build
        uses: actions/cache@v4
        with:
          path: runner/target
          key: runner-${{ runner.os }}-${{ steps.pins.outputs.server }}-${{ hashFiles('runner/Cargo.toml', 'runner/src/**') }}
          restore-keys: runner-${{ runner.os }}-${{ steps.pins.outputs.server }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          composer install --no-interaction --no-progress --working-dir=packages/adapter-php-parser-source/extractor

      - name: Cache WordPress
        uses: actions/cache@v4
        with:
          path: .cache/wordpress-*
          key: wordpress-${{ steps.pins.outputs.wordpress }}

      - name: Test and build the runner
        run: |
          bun run runner:link
          bun run runner:test
          bun run runner:build

      - name: Run the examples and list the runtime's API
        run: |
          bun run guide examples
          bun run guide reflect

      - name: Build
        run: bun run guide all --offline

      # After the build, so the site gets the full data (inventory, assignment, graph, cycles), not a partial set.
      - name: Keep the generated data for the site
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated/

  site:
    needs: examples
    # The site needs the full generated data, which the examples job uploads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: generated/

      - name: Test and build the site
        run: |
          bun run site:test
          bun run site:build

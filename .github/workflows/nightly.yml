name: Nightly against speedyspec-server main

# Runs the examples against the server's main branch, so a change there that breaks one is seen before the pin moves.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  examples:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: guide_examples
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GUIDE_MYSQL_URL: mysql://root:password@127.0.0.1:3306/guide_examples
      GUIDE_SERVER_DIR: ${{ github.workspace }}/.cache/speedyspec-server
      # The runner is built for musl, in a container (scripts/linux-runner.sh), and runs here fully static.
      GUIDE_RUNNER: ${{ github.workspace }}/runner/target/x86_64-unknown-linux-musl/release/speedyspec-guide-examples
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          echo "server=$(jq -r .server.commit sources.json)" >> "$GITHUB_OUTPUT"
          echo "wordpress=$(jq -r .wordpress.commit sources.json)" >> "$GITHUB_OUTPUT"

      - name: Check out speedyspec-server at the pin
        uses: actions/checkout@v4
        with:
          repository: SpeedySpec/speedyspec-server
          ref: main
          path: .cache/speedyspec-server

      # speedyspec-server's static PHP is built for musl, so it and the runner that links it are built in a musl
      # container; on this glibc host the link fails on musl-only symbols.
      - name: Cache the static PHP
        id: php
        uses: actions/cache@v4
        with:
          path: .cache/speedyspec-server/.php-build-linux
          key: php-musl-${{ runner.os }}-${{ hashFiles('.cache/speedyspec-server/php-version', '.cache/speedyspec-server/craft.yml', '.cache/speedyspec-server/scripts/build-php.sh', 'scripts/linux-runner.sh') }}

      - name: Build the static PHP
        if: steps.php.outputs.cache-hit != 'true'
        env:
          # spc looks up source releases through the GitHub API; the read-only token avoids rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/linux-runner.sh bash -c 'cd .cache/speedyspec-server && scripts/build-php.sh'

      - name: Cache the runner build
        uses: actions/cache@v4
        with:
          path: runner/target
          key: runner-nightly-musl-${{ runner.os }}-${{ github.run_id }}${{ hashFiles('runner/Cargo.toml', 'runner/src/**') }}
          restore-keys: runner-nightly-musl-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          composer install --no-interaction --no-progress --working-dir=packages/adapter-php-parser-source/extractor

      - name: Cache WordPress
        uses: actions/cache@v4
        with:
          path: .cache/wordpress-*
          key: wordpress-${{ steps.pins.outputs.wordpress }}

      - name: Test and build the runner
        env:
          GUIDE_PHP_BUILDROOT: ${{ github.workspace }}/.cache/speedyspec-server/.php-build-linux/buildroot
        run: |
          bun run runner:link
          scripts/linux-runner.sh bash -c 'cd runner && cargo test && cargo build --release'

      - name: Run the examples and list the runtime's API
        id: run
        run: |
          set -o pipefail
          { bun run guide examples && bun run guide reflect; } 2>&1 | tee run.log

      - name: Open an issue when they fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Examples fail against speedyspec-server main'
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            { echo 'The nightly run against speedyspec-server main failed.'; echo; echo '```'; tail -n 100 run.log 2>/dev/null || true; echo '```'; echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi

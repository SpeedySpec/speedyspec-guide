name: "Metadata"
job: "Adds, reads, updates and deletes the metadata of posts, comments, terms, users and sites, and registers meta keys."
ported: true
crates: [speedyspec-wp-meta-contracts, speedyspec-wp-meta, speedyspec-wp-meta-memory, speedyspec-wp-meta-sql, speedyspec-wp-meta-php, speedyspec-wp-meta-tests]
files:
  - 'wp-includes/class-wp-metadata-lazyloader.php'
  - 'wp-includes/meta.php'
# Loaded before each example on the WordPress side; its setup recreates WordPress's tables in MySQL. The examples
# store meta on posts and terms, so they load what the Taxonomies seam's examples load.
wordpress:
  - wp-includes/plugin.php
  - wp-includes/load.php
  - wp-includes/compat.php
  - wp-includes/compat-utf8.php
  - wp-includes/utf8.php

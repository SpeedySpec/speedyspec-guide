name: Hooks
job: Lets code register callbacks on named filters and actions, and runs them in priority order.
ported: true
files:
  - wp-includes/plugin.php
  - wp-includes/class-wp-hook.php
  - wp-includes/class-wp-filter-sentinel.php
exclude:
  - function:plugin_basename
  - function:wp_register_plugin_realpath
  - function:plugin_dir_path
  - function:plugin_dir_url
  - function:register_activation_hook
  - function:register_deactivation_hook
  - function:register_uninstall_hook
# Loaded before each example on the WordPress side (plugin.php loads class-wp-hook.php itself).
wordpress:
  - wp-includes/plugin.php
packages: [wp-plugin]
crates: [speedyspec-wp-hooks, speedyspec-wp-hooks-memory, speedyspec-wp-hooks-php, speedyspec-container, speedyspec-container-php, speedyspec-php-ext]
symbols:
  - "method:WP_Hook::__construct"
  - "method:WP_Hook::speedyspec_wrap"
  - "method:WP_Hook::__clone"
  - "method:WP_Hook::__get"
  - "method:WP_Hook::speedyspec_write_back"
  - "method:WP_Hook::speedyspec_write_back_all"
  - "method:WP_Hook::__set"
  - "method:WP_Hook::__isset"
  - "method:WP_Hook::__unset"
  - "method:WP_Hook::count"
  - global:wp_filter
  - global:wp_actions
  - global:wp_filters
  - global:wp_current_filter
  - "class:SpeedySpec\\WpHooks\\HookStorage"
  - "class:SpeedySpec\\WpHooks\\HookGlobal"
  - "class:SpeedySpec\\WpHooks\\FilterGlobal"
  - "class:SpeedySpec\\WpHooks\\CountGlobal"
  - "function:SpeedySpec\\WpHooks\\use_as_key"
  - "function:SpeedySpec\\WpHooks\\write_back_views"
  - "function:SpeedySpec\\WpHooks\\install_globals"
  - "function:SpeedySpec\\WpHooks\\Native\\add_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\apply_filters"
  - "function:SpeedySpec\\WpHooks\\Native\\apply_filters_deprecated"
  - "function:SpeedySpec\\WpHooks\\Native\\apply_filters_ref_array"
  - "function:SpeedySpec\\WpHooks\\Native\\call_all_hook"
  - "function:SpeedySpec\\WpHooks\\Native\\current_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\did_action"
  - "function:SpeedySpec\\WpHooks\\Native\\did_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\do_action"
  - "function:SpeedySpec\\WpHooks\\Native\\do_action_deprecated"
  - "function:SpeedySpec\\WpHooks\\Native\\do_action_ref_array"
  - "function:SpeedySpec\\WpHooks\\Native\\doing_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\global_all"
  - "function:SpeedySpec\\WpHooks\\Native\\global_count"
  - "function:SpeedySpec\\WpHooks\\Native\\global_get"
  - "function:SpeedySpec\\WpHooks\\Native\\global_has"
  - "function:SpeedySpec\\WpHooks\\Native\\global_set"
  - "function:SpeedySpec\\WpHooks\\Native\\global_unset"
  - "function:SpeedySpec\\WpHooks\\Native\\has_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_add_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_apply_filters"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_callbacks"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_clone"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_current_priority"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_do_action"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_do_all_hook"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_has_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_has_filters"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_new"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_offset_exists"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_offset_get"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_offset_set"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_offset_unset"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_priorities"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_remove_all_filters"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_remove_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\hook_replace_callbacks"
  - "function:SpeedySpec\\WpHooks\\Native\\remove_all_filters"
  - "function:SpeedySpec\\WpHooks\\Native\\remove_filter"
  - "function:SpeedySpec\\WpHooks\\Native\\unique_id"
roles:
  register: [function:add_filter, function:add_action]
  run: [function:apply_filters, function:apply_filters_ref_array, function:do_action, function:do_action_ref_array, function:apply_filters_deprecated, function:do_action_deprecated]
  remove: [function:remove_filter, function:remove_all_filters, function:remove_action, function:remove_all_actions]
  inspect: [function:has_filter, function:has_action, function:current_filter, function:current_action, function:doing_filter, function:doing_action, function:did_filter, function:did_action]
  classes-and-state: [class:WP_Hook, global:wp_filter, global:wp_actions, global:wp_filters, global:wp_current_filter]
  internals: [function:_wp_call_all_hook, function:_wp_filter_build_unique_id, "filter:{$hook_name}", "action:{$hook_name}"]
  speedyspec: ["class:SpeedySpec\\WpHooks\\HookStorage", "class:SpeedySpec\\WpHooks\\HookGlobal", "class:SpeedySpec\\WpHooks\\FilterGlobal", "class:SpeedySpec\\WpHooks\\CountGlobal", "function:SpeedySpec\\WpHooks\\use_as_key", "function:SpeedySpec\\WpHooks\\write_back_views", "function:SpeedySpec\\WpHooks\\install_globals"]
  speedyspec-internals: ["function:SpeedySpec\\WpHooks\\Native\\add_filter", "function:SpeedySpec\\WpHooks\\Native\\apply_filters", "function:SpeedySpec\\WpHooks\\Native\\apply_filters_deprecated", "function:SpeedySpec\\WpHooks\\Native\\apply_filters_ref_array", "function:SpeedySpec\\WpHooks\\Native\\call_all_hook", "function:SpeedySpec\\WpHooks\\Native\\current_filter", "function:SpeedySpec\\WpHooks\\Native\\did_action", "function:SpeedySpec\\WpHooks\\Native\\did_filter", "function:SpeedySpec\\WpHooks\\Native\\do_action", "function:SpeedySpec\\WpHooks\\Native\\do_action_deprecated", "function:SpeedySpec\\WpHooks\\Native\\do_action_ref_array", "function:SpeedySpec\\WpHooks\\Native\\doing_filter", "function:SpeedySpec\\WpHooks\\Native\\global_all", "function:SpeedySpec\\WpHooks\\Native\\global_count", "function:SpeedySpec\\WpHooks\\Native\\global_get", "function:SpeedySpec\\WpHooks\\Native\\global_has", "function:SpeedySpec\\WpHooks\\Native\\global_set", "function:SpeedySpec\\WpHooks\\Native\\global_unset", "function:SpeedySpec\\WpHooks\\Native\\has_filter", "function:SpeedySpec\\WpHooks\\Native\\hook_add_filter", "function:SpeedySpec\\WpHooks\\Native\\hook_apply_filters", "function:SpeedySpec\\WpHooks\\Native\\hook_callbacks", "function:SpeedySpec\\WpHooks\\Native\\hook_clone", "function:SpeedySpec\\WpHooks\\Native\\hook_current_priority", "function:SpeedySpec\\WpHooks\\Native\\hook_do_action", "function:SpeedySpec\\WpHooks\\Native\\hook_do_all_hook", "function:SpeedySpec\\WpHooks\\Native\\hook_has_filter", "function:SpeedySpec\\WpHooks\\Native\\hook_has_filters", "function:SpeedySpec\\WpHooks\\Native\\hook_new", "function:SpeedySpec\\WpHooks\\Native\\hook_offset_exists", "function:SpeedySpec\\WpHooks\\Native\\hook_offset_get", "function:SpeedySpec\\WpHooks\\Native\\hook_offset_set", "function:SpeedySpec\\WpHooks\\Native\\hook_offset_unset", "function:SpeedySpec\\WpHooks\\Native\\hook_priorities", "function:SpeedySpec\\WpHooks\\Native\\hook_remove_all_filters", "function:SpeedySpec\\WpHooks\\Native\\hook_remove_filter", "function:SpeedySpec\\WpHooks\\Native\\hook_replace_callbacks", "function:SpeedySpec\\WpHooks\\Native\\remove_all_filters", "function:SpeedySpec\\WpHooks\\Native\\remove_filter", "function:SpeedySpec\\WpHooks\\Native\\unique_id"]
edges:
  - { from: function:add_filter, to: function:remove_filter, kind: undone-by, at: { scenario: callback_kind_closure } }
  - { from: function:add_action, to: function:remove_action, kind: undone-by, at: { scenario: remove_action_alias } }
  - { from: function:add_action, to: function:add_filter, kind: alias, at: { scenario: globals_after_mixed_use } }
  - { from: function:has_action, to: function:has_filter, kind: alias, at: { scenario: has_filter_variants } }
  - { from: function:remove_action, to: function:remove_filter, kind: alias, at: { source: "wp:wp-includes/plugin.php#L624", hash: fb581baeff5e99d42bece9fe5a19c5858880726c9b47212de7b73a4b0ef444ae } }
  - { from: function:remove_all_actions, to: function:remove_all_filters, kind: alias, at: { source: "wp:wp-includes/plugin.php#L638", hash: 5ea43f32a25e30166f74538e322111164ab755a88f8738babd9f533274f759f5 } }
  - { from: function:current_action, to: function:current_filter, kind: alias, at: { scenario: current_and_doing_outside_a_hook } }
  - { from: function:doing_action, to: function:doing_filter, kind: alias, at: { scenario: current_and_doing_outside_a_hook } }
  - { from: function:did_action, to: global:wp_actions, kind: reads, at: { scenario: wp_actions_read_and_write } }

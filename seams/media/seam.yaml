name: "Media"
job: "Stores, sizes and describes attachments, reads media metadata through getID3, and renders galleries and players."
ported: false
files:
  - 'wp-includes/media.php'
elsewhere:
  - name: "getID3"
    docs: "https://www.getid3.org/"
    files: ["wp-includes/ID3/**"]
    note: "WordPress bundles getID3 to read the metadata of audio and video files; wp_read_audio_metadata() and wp_read_video_metadata() call it."
  - name: "AVIF info (libavifinfo)"
    docs: "https://aomedia.googlesource.com/libavifinfo/"
    files: ["wp-includes/class-avif-info.php"]
    note: "A PHP port of libavifinfo that reads the size and features of AVIF images without decoding them; wp_get_avif_info() calls it."
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
# Symbols whose file belongs to another seam.
symbols:
  - "constant:GETID3_TEMP_DIR"

name: "Abilities"
job: "Registers abilities and ability categories, and looks them up from their registries."
ported: false
files:
  - 'wp-includes/abilities/**'
  - 'wp-includes/abilities-api.php'
  - 'wp-includes/abilities-api/class-wp-abilities-registry.php'
  - 'wp-includes/abilities-api/class-wp-ability-categories-registry.php'
  - 'wp-includes/abilities-api/class-wp-ability-category.php'
  - 'wp-includes/abilities-api/class-wp-ability.php'
  - 'wp-includes/abilities.php'
# Loaded in this order before each example on the WordPress side. There is no database and no logged-in user.
wordpress:
  - wp-includes/plugin.php
  - wp-includes/load.php
  - wp-includes/compat.php
  - wp-includes/compat-utf8.php
  - wp-includes/utf8.php
  - wp-includes/formatting.php
  - wp-includes/functions.php
  - wp-includes/kses.php
  - wp-includes/class-wp-error.php
  - wp-includes/class-wp-object-cache.php
  - wp-includes/cache.php
  # Ability input and output are checked against JSON schemas with the REST API's validators.
  - wp-includes/rest-api.php
  - wp-includes/class-wp-role.php
  - wp-includes/class-wp-roles.php
  - wp-includes/class-wp-user.php
  - wp-includes/capabilities.php
  - wp-includes/user.php
  - wp-includes/pluggable.php
  - wp-includes/abilities-api/class-wp-ability-category.php
  - wp-includes/abilities-api/class-wp-ability-categories-registry.php
  - wp-includes/abilities-api/class-wp-ability.php
  - wp-includes/abilities-api/class-wp-abilities-registry.php
  - wp-includes/abilities-api.php
setup: setup.php

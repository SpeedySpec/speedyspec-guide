name: "Object Cache"
job: "Stores and fetches values in the object cache by key and group."
ported: true
files:
  - 'wp-includes/cache-compat.php'
  - 'wp-includes/cache.php'
  - 'wp-includes/class-wp-object-cache.php'
# Loaded in this order before each example on the WordPress side, then setup.php starts a fresh cache.
# cache-compat.php defines only what cache.php doesn't: the *_salted functions.
wordpress:
  - wp-includes/plugin.php
  - wp-includes/load.php
  - wp-includes/compat.php
  - wp-includes/formatting.php
  - wp-includes/functions.php
  - wp-includes/class-wp-object-cache.php
  - wp-includes/cache.php
  - wp-includes/cache-compat.php
setup: setup.php
crates: [speedyspec-wp-object-cache, speedyspec-wp-object-cache-contracts, speedyspec-wp-object-cache-php, speedyspec-cache, speedyspec-cache-memory, speedyspec-cache-sql, speedyspec-cache-kv, speedyspec-cache-file, speedyspec-cache-routing, speedyspec-cache-conformance]

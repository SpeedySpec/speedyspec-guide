# The state of each symbol this seam depends on in another seam (DependencyStateRecorded).
dependencies:
  function:__:
    # The CacheNotices port's PHP adapter translates a _doing_it_wrong() message with WordPress's __() when it exists.
    state: port
    cite: { source: "ss:crates/speedyspec-wp-object-cache-php/src/ports.rs#L21-L28", hash: "b9487f0e470b2a36b2e999350837971b2be31835a87b30cb69d6041ef56173d3" }
  function:wp_load_translations_early:
    # WordPress loads translations before its notice; the CacheNotices port's PHP adapter calls __() only when it exists.

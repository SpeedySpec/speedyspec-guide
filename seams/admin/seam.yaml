name: "Admin"
job: "Renders and handles the WordPress admin screens and the functions they include."
ported: false
files:
  - wp-admin/**
# Functions no example can run on WordPress; the coverage gate asks only for their pages.
unrunnable:
  - symbol: "function:wp_ajax_fetch_list"
    reason: "It ends the request with exit."
  - symbol: "function:wp_ajax_rest_nonce"
    reason: "It ends the request with exit."
  - symbol: "function:wp_ajax_wp_compression_test"
    reason: "It ends the request with exit."
  - symbol: "function:media_send_to_editor"
    reason: "It ends the request with exit."
  - symbol: "function:redirect_post"
    reason: "It redirects and ends the request with exit."
  - symbol: "function:comment_footer_die"
    reason: "It ends the request with die."
  - symbol: "function:export_add_js"
    reason: "It is defined in wp-admin/export.php, which runs the whole screen when loaded."
  - symbol: "function:export_date_options"
    reason: "It is defined in wp-admin/export.php, which runs the whole screen when loaded."
  - symbol: "function:maybe_drop_column"
    reason: "It is defined in wp-admin/install-helper.php, which loads WordPress again when included."
  - symbol: "function:check_column"
    reason: "It is defined in wp-admin/install-helper.php, which loads WordPress again when included."
  - symbol: "function:display_header"
    reason: "It is defined in wp-admin/install.php, which runs the installer when loaded."
  - symbol: "function:display_setup_form"
    reason: "It is defined in wp-admin/install.php, which runs the installer when loaded."
  - symbol: "function:setup_config_display_header"
    reason: "It is defined in wp-admin/setup-config.php, which runs the wp-config.php setup when loaded."
  - symbol: "function:wp_nav_menu_max_depth"
    reason: "It is defined in wp-admin/nav-menus.php, which runs the whole screen when loaded."
  - symbol: "function:_wp_connectors_preload_paths"
    reason: "It is defined in wp-admin/options-connectors.php, which runs the whole screen when loaded."
  - symbol: "function:wp_load_press_this"
    reason: "It is defined in wp-admin/press-this.php, which runs the whole screen when loaded."
  - symbol: "function:_wp_get_site_editor_redirection_url"
    reason: "It is defined in wp-admin/site-editor.php, which runs the whole screen when loaded."
  - symbol: "function:wp_theme_auto_update_setting_template"
    reason: "It is defined in wp-admin/themes.php, which runs the whole screen when loaded."
  - symbol: "function:list_core_update"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:dismissed_updates"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:core_upgrade_preamble"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:core_auto_updates_settings"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:list_plugin_updates"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:list_theme_updates"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:list_translation_updates"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:do_core_upgrade"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:do_dismiss_core_update"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
  - symbol: "function:do_undismiss_core_update"
    reason: "It is defined in wp-admin/update-core.php, which runs the whole screen when loaded."
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
# SpeedySpec answers wp_read_audio_metadata(), wp_read_video_metadata(), wp_add_id3_tag_data() and
# wp_get_media_creation_timestamp() natively, from the Media seam's crates (speedyspec-wp-media*), which that seam
# lists; the rest of wp-admin is WordPress's PHP, so this seam stays unported.
# Symbols whose file belongs to another seam.
symbols:
  - "action:customize_controls_enqueue_scripts"
  - "action:customize_controls_head"
  - "action:customize_controls_init"
  - "action:customize_controls_print_footer_scripts"
  - "action:customize_controls_print_scripts"
  - "action:customize_controls_print_styles"
  - "function:upgrade_700"
  - "function:wp_get_translation_update_data"
  - "function:wp_get_translation_update_language"
  - "function:wp_get_translation_update_name"
  - "function:wp_get_translation_update_plugin_names"
  - "function:wp_process_translation_update_selection"
  - "global:_new_bundled_files"
  - "global:_old_requests_files"

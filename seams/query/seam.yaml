name: "Query"
job: "Parses requests into queries, queries posts, comments and metadata through wpdb, and holds the post and comment objects."
ported: false
files:
  - 'wp-includes/bookmark.php'
  - 'wp-includes/class-wp-comment-query.php'
  - 'wp-includes/class-wp-comment.php'
  - 'wp-includes/class-wp-date-query.php'
  - 'wp-includes/class-wp-meta-query.php'
  - 'wp-includes/class-wp-post-type.php'
  - 'wp-includes/class-wp-post.php'
  - 'wp-includes/class-wp-query.php'
  - 'wp-includes/class-wp.php'
  - 'wp-includes/class-wpdb.php'
  - 'wp-includes/comment.php'
  - 'wp-includes/post-formats.php'
  - 'wp-includes/post.php'
  - 'wp-includes/query.php'
  - 'wp-includes/revision.php'
# WordPress is booted by the setup (see boot.php); the runner needs one file to load first.
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
# wpdb (class-wpdb.php) is native: speedyspec-wp-db and its PHP facade, over the data layer's engines. The post type
# and post status rules, and the post entity with its date, slug and hierarchy rules (speedyspec-wp-posts-contracts,
# speedyspec-wp-posts, speedyspec-wp-posts-memory, speedyspec-wp-posts-sql), are in Rust but not wired into PHP yet.
# The rest of the seam (posts, comments, WP_Query, WP) is still WordPress's PHP, so the seam is not ported.
crates: [speedyspec-wp-db, speedyspec-wp-posts-contracts, speedyspec-wp-posts, speedyspec-wp-posts-memory, speedyspec-wp-posts-sql, speedyspec-wp-db-php, speedyspec-data, speedyspec-data-query, speedyspec-data-uow, speedyspec-data-translate, speedyspec-data-mysql, speedyspec-data-postgres, speedyspec-data-sqlite, speedyspec-data-memory, speedyspec-data-file, speedyspec-data-redb, speedyspec-data-valkey, speedyspec-data-counter, speedyspec-data-corpus, speedyspec-data-conformance]
# Symbols whose file belongs to another seam, then SpeedySpec's wpdb API.
symbols:
  - "function:_truncate_post_slug"
  - "class:SpeedySpec\\WpDb\\Connection"
  - "class:SpeedySpec\\WpDb\\WpdbState"

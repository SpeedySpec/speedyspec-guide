name: "Query"
job: "Parses requests into queries, queries posts, comments and metadata through wpdb, and holds the post and comment objects."
ported: false
files:
  - 'wp-includes/bookmark.php'
  - 'wp-includes/class-wp-comment-query.php'
  - 'wp-includes/class-wp-comment.php'
  - 'wp-includes/class-wp-date-query.php'
  - 'wp-includes/class-wp-meta-query.php'
  - 'wp-includes/class-wp-post-type.php'
  - 'wp-includes/class-wp-post.php'
  - 'wp-includes/class-wp-query.php'
  - 'wp-includes/class-wp.php'
  - 'wp-includes/class-wpdb.php'
  - 'wp-includes/comment.php'
  - 'wp-includes/post-formats.php'
  - 'wp-includes/post.php'
  - 'wp-includes/query.php'
  - 'wp-includes/revision.php'
# WordPress is booted by the setup (see boot.php); the runner needs one file to load first.
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
# wpdb (class-wpdb.php) is native: speedyspec-wp-db, its port in speedyspec-wp-db-contracts and its PHP facade, over
# the data layer's engines. Post reading is native too (phase 4 of the posts and meta port): 55 of post.php's
# functions, the post type and post status registries, get_post() and the readers beside it, the counts and dates,
# the posts caches and sanitize_post(), through speedyspec-wp-posts-php over the read use cases (speedyspec-wp-posts)
# and the SQL repository (speedyspec-wp-posts-sql). The rest of the seam (post writes, the meta wrappers, WP_Query and
# its callers, comments, revisions, WP) is still WordPress's PHP, so the seam is not ported.
crates: [speedyspec-wp-db, speedyspec-wp-db-contracts, speedyspec-wp-posts-contracts, speedyspec-wp-posts, speedyspec-wp-posts-memory, speedyspec-wp-posts-sql, speedyspec-wp-posts-php, speedyspec-wp-posts-tests, speedyspec-wp-db-php, speedyspec-data, speedyspec-data-query, speedyspec-data-uow, speedyspec-data-translate, speedyspec-data-mysql, speedyspec-data-postgres, speedyspec-data-sqlite, speedyspec-data-memory, speedyspec-data-file, speedyspec-data-redb, speedyspec-data-valkey, speedyspec-data-counter, speedyspec-data-corpus, speedyspec-data-conformance]
# Symbols whose file belongs to another seam, then SpeedySpec's wpdb API, then its post API: the natives post.php's
# one-line functions call, the PHP helpers beside them, and the repository twin a PHP object implements.

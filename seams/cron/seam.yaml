name: "Cron"
job: "Schedules, reschedules and runs events stored in the cron option."
ported: true
files:
  - 'wp-includes/cron.php'
# Loaded before each example on the WordPress side. The HTTP API is there for spawn_cron(), whose request the
# examples catch on pre_http_request (class-wp-http.php registers the Requests autoloader).
wordpress:
  - wp-includes/plugin.php
  - wp-includes/load.php
  - wp-includes/compat.php
  - wp-includes/compat-utf8.php
  - wp-includes/utf8.php
  - wp-includes/formatting.php
  - wp-includes/functions.php
  - wp-includes/general-template.php
  - wp-includes/kses.php
  - wp-includes/class-wp-error.php
  - wp-includes/class-wp-object-cache.php
  - wp-includes/cache.php
  - wp-includes/link-template.php
  - wp-includes/http.php
  - wp-includes/class-wp-http.php
  - wp-includes/class-wp-http-proxy.php
  - wp-includes/class-wp-http-cookie.php
  - wp-includes/class-wp-http-response.php
  - wp-includes/class-wp-http-requests-response.php
  - wp-includes/class-wp-http-requests-hooks.php
  - wp-includes/cron.php
setup: setup.php
crates: [speedyspec-wp-cron, speedyspec-wp-cron-contracts, speedyspec-wp-cron-options, speedyspec-wp-cron-php]
symbols:
  - "function:SpeedySpec\\WpCron\\run_due_events"
  - "function:SpeedySpec\\WpCron\\due_sites"
  - "function:SpeedySpec\\Runtime\\report_next_wake"
  - "function:SpeedySpec\\WpCron\\Native\\wp_schedule_single_event"
  - "function:SpeedySpec\\WpCron\\Native\\wp_schedule_event"
  - "function:SpeedySpec\\WpCron\\Native\\wp_reschedule_event"
  - "function:SpeedySpec\\WpCron\\Native\\wp_unschedule_event"
  - "function:SpeedySpec\\WpCron\\Native\\wp_clear_scheduled_hook"
  - "function:SpeedySpec\\WpCron\\Native\\wp_unschedule_hook"
  - "function:SpeedySpec\\WpCron\\Native\\wp_get_scheduled_event"
  - "function:SpeedySpec\\WpCron\\Native\\wp_next_scheduled"
  - "function:SpeedySpec\\WpCron\\Native\\wp_get_ready_cron_jobs"
  - "function:SpeedySpec\\WpCron\\Native\\wp_get_schedules"
  - "function:SpeedySpec\\WpCron\\Native\\wp_get_schedule"
  - "function:SpeedySpec\\WpCron\\Native\\_get_cron_array"
  - "function:SpeedySpec\\WpCron\\Native\\_set_cron_array"
  - "function:SpeedySpec\\WpCron\\Native\\_upgrade_cron_array"
  - "function:SpeedySpec\\WpCron\\Native\\spawn_cron"
  - "function:SpeedySpec\\WpCron\\result"
  - "function:SpeedySpec\\WpCron\\error"
  - "function:SpeedySpec\\WpCron\\report_error"
  - "function:SpeedySpec\\WpCron\\to_object"
  - "function:SpeedySpec\\WpCron\\property"
  - "function:SpeedySpec\\WpCron\\is_wp_error"
  - "function:SpeedySpec\\WpCron\\network_sites"
roles:
  schedule: [function:wp_schedule_single_event, function:wp_schedule_event, function:wp_reschedule_event]
  unschedule: [function:wp_unschedule_event, function:wp_clear_scheduled_hook, function:wp_unschedule_hook]
  read: [function:wp_get_scheduled_event, function:wp_next_scheduled, function:wp_get_ready_cron_jobs, function:wp_get_schedules, function:wp_get_schedule]
  run: [function:spawn_cron, function:wp_cron, function:_wp_cron]
  cron-array: [function:_get_cron_array, function:_set_cron_array, function:_upgrade_cron_array]
  speedyspec: ["function:SpeedySpec\\WpCron\\run_due_events", "function:SpeedySpec\\WpCron\\due_sites", "function:SpeedySpec\\Runtime\\report_next_wake"]
  speedyspec-internals: ["function:SpeedySpec\\WpCron\\Native\\wp_schedule_single_event", "function:SpeedySpec\\WpCron\\Native\\wp_schedule_event", "function:SpeedySpec\\WpCron\\Native\\wp_reschedule_event", "function:SpeedySpec\\WpCron\\Native\\wp_unschedule_event", "function:SpeedySpec\\WpCron\\Native\\wp_clear_scheduled_hook", "function:SpeedySpec\\WpCron\\Native\\wp_unschedule_hook", "function:SpeedySpec\\WpCron\\Native\\wp_get_scheduled_event", "function:SpeedySpec\\WpCron\\Native\\wp_next_scheduled", "function:SpeedySpec\\WpCron\\Native\\wp_get_ready_cron_jobs", "function:SpeedySpec\\WpCron\\Native\\wp_get_schedules", "function:SpeedySpec\\WpCron\\Native\\wp_get_schedule", "function:SpeedySpec\\WpCron\\Native\\_get_cron_array", "function:SpeedySpec\\WpCron\\Native\\_set_cron_array", "function:SpeedySpec\\WpCron\\Native\\_upgrade_cron_array", "function:SpeedySpec\\WpCron\\Native\\spawn_cron", "function:SpeedySpec\\WpCron\\result", "function:SpeedySpec\\WpCron\\error", "function:SpeedySpec\\WpCron\\report_error", "function:SpeedySpec\\WpCron\\to_object", "function:SpeedySpec\\WpCron\\property", "function:SpeedySpec\\WpCron\\is_wp_error", "function:SpeedySpec\\WpCron\\network_sites"]

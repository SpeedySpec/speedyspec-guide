name: "Internationalization"
job: "Loads translation files, translates strings, switches locales and holds locale data."
ported: false
files:
  - 'wp-includes/pomo/**'
  - 'wp-includes/l10n/**'
  - 'wp-includes/class-wp-locale-switcher.php'
  - 'wp-includes/class-wp-locale.php'
  - 'wp-includes/class-wp-textdomain-registry.php'
  - 'wp-includes/class-wp-token-map.php'
  - 'wp-includes/compat-utf8.php'
  - 'wp-includes/compat.php'
  - 'wp-includes/l10n.php'
  - 'wp-includes/utf8.php'
# Loaded in this order before each example on the WordPress side.
wordpress:
  - wp-includes/plugin.php
  - wp-includes/load.php
  - wp-includes/compat.php
  - wp-includes/compat-utf8.php
  - wp-includes/utf8.php
  - wp-includes/class-wp-token-map.php
  - wp-includes/formatting.php
  - wp-includes/functions.php
setup: ../basic-setup.php

name: "Support"
job: "Holds the general functions, loading helpers, pluggable functions, errors and constants the other seams share."
ported: false
files:
  - 'wp-includes/class-wp-ajax-response.php'
  - 'wp-includes/class-wp-error.php'
  - 'wp-includes/class-wp-exception.php'
  - 'wp-includes/class-wp-fatal-error-handler.php'
  - 'wp-includes/class-wp-list-util.php'
  - 'wp-includes/default-constants.php'
  - 'wp-includes/error-protection.php'
  - 'wp-includes/functions.php'
  - 'wp-includes/load.php'
  - 'wp-includes/php-compat/readonly.php'
  - 'wp-includes/pluggable.php'
  - 'wp-includes/vars.php'
# WordPress is booted by the setup (see boot.php); the runner needs one file to load first.
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
# SpeedySpec answers 16 of this seam's functions natively: the pluggable password functions and wp_rand(), and
# wp_fast_hash()/wp_verify_fast_hash() (Passwords and crypto seam's crates), wp_text_diff() (Text diff seam's crates),
# and wp_get_image_mime() with the MIME list and filetype functions (Media seam's crates). Their crates are listed by
# those seams; the rest of this seam is WordPress's PHP, so it stays unported.
# Symbols whose file belongs to another seam.
symbols:
  - "constant:WP_CONTENT_DIR"
  - "constant:WP_SANDBOX_SCRAPING"

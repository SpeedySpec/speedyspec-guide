name: "Plugin registry"
job: "Registers and runs SpeedySpec's own hooks, shared by Rust and PHP plugins."
ported: true
files: []
wordpress: []
crates: [speedyspec-hooks, speedyspec-hooks-memory, speedyspec-php]

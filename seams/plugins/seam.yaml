name: "Plugins"
job: "Locates plugin files and URLs, records activation, deactivation and uninstall callbacks, and tracks plugin dependencies and paused extensions."
ported: false
files:
  - 'wp-includes/default-filters.php'
  - 'wp-includes/class-wp-paused-extensions-storage.php'
  - 'wp-includes/class-wp-plugin-dependencies.php'
wordpress: []
# Symbols whose file belongs to another seam.
symbols:
  - "function:plugin_basename"
  - "function:plugin_dir_path"
  - "function:plugin_dir_url"
  - "function:register_activation_hook"
  - "function:register_deactivation_hook"
  - "function:register_uninstall_hook"
  - "function:wp_register_plugin_realpath"
  - "global:wp_plugin_paths"

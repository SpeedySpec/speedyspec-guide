name: "Blocks"
job: "Registers block types, parses and renders block markup, applies block supports, and serves block templates and patterns."
ported: false
files:
  - 'wp-includes/blocks/**'
  - 'wp-includes/block-supports/**'
  - 'wp-includes/class-wp-block-parser*.php'
  - 'wp-includes/build/**'
  - 'wp-includes/view-config.php'
  - 'wp-includes/class-wp-view-config-data.php'
  - 'wp-includes/icons.php'
  - 'wp-includes/class-wp-icons-registry.php'
  - 'wp-includes/class-wp-icon-collections-registry.php'
  - 'wp-admin/customize.php'
  - 'wp-includes/block-bindings.php'
  - 'wp-includes/block-bindings/pattern-overrides.php'
  - 'wp-includes/block-bindings/post-data.php'
  - 'wp-includes/block-bindings/post-meta.php'
  - 'wp-includes/block-bindings/term-data.php'
  - 'wp-includes/block-editor.php'
  - 'wp-includes/block-patterns.php'
  - 'wp-includes/block-template-utils.php'
  - 'wp-includes/block-template.php'
  - 'wp-includes/blocks.php'
  - 'wp-includes/class-wp-block-bindings-registry.php'
  - 'wp-includes/class-wp-block-bindings-source.php'
  - 'wp-includes/class-wp-block-editor-context.php'
  - 'wp-includes/class-wp-block-list.php'
  - 'wp-includes/class-wp-block-metadata-registry.php'
  - 'wp-includes/class-wp-block-pattern-categories-registry.php'
  - 'wp-includes/class-wp-block-patterns-registry.php'
  - 'wp-includes/class-wp-block-processor.php'
  - 'wp-includes/class-wp-block-styles-registry.php'
  - 'wp-includes/class-wp-block-supports.php'
  - 'wp-includes/class-wp-block-template.php'
  - 'wp-includes/class-wp-block-templates-registry.php'
  - 'wp-includes/class-wp-block-type-registry.php'
  - 'wp-includes/class-wp-block-type.php'
  - 'wp-includes/class-wp-block.php'
  - 'wp-includes/class-wp-classic-to-block-menu-converter.php'
  - 'wp-includes/class-wp-duotone.php'
# WordPress is booted by the setup (see boot.php); the runner needs one file to load first.
# Functions no example can run on WordPress; the coverage gate asks only for their pages.
unrunnable:
  - symbol: "function:block_core_navigation_get_menu_items_at_location"
    reason: "It is defined only when the Gutenberg plugin's IS_GUTENBERG_PLUGIN is true."
  - symbol: "function:block_core_navigation_sort_menu_items_by_parent_id"
    reason: "It is defined only when the Gutenberg plugin's IS_GUTENBERG_PLUGIN is true."
  - symbol: "function:block_core_navigation_get_inner_blocks_from_unstable_location"
    reason: "It is defined only when the Gutenberg plugin's IS_GUTENBERG_PLUGIN is true."
  - symbol: "function:wp_font_library_render_page"
    reason: "It prints the full page and ends the request with exit."
  - symbol: "function:wp_options_connectors_render_page"
    reason: "It prints the full page and ends the request with exit."
wordpress:
  - wp-includes/version.php
setup: setup.php
mysql: true
